services:
  db:
    image: mysql:5.7
    container_name: jarvis_db
    env_file:
      - .env
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  flask_api:
    build: .
    container_name: jarvis_api
    restart: always
    env_file:
      - .env
    depends_on:
      db:
        condition: service_started
    ports:
      - "${FLASK_PORT}:5000"
    volumes:
      - .:/app

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: jarvis_phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      - db
    ports:
      - "8080:80"

volumes:
  mysql_data:
